# Version catalog. Kept lean — every dependency is justified for the APK budget
# (< 12 MB) and low-end performance per KOTLIN_APP_PLAN.md §2/§3.
[versions]
agp = "8.6.0"
kotlin = "2.0.20"
coreKtx = "1.13.1"
coreSplashscreen = "1.0.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.03"
navigation = "2.8.2"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
retrofitSerialization = "1.0.0"
coroutines = "1.9.0"
coil = "2.7.0"
camerax = "1.4.2"
mlkitBarcode = "17.3.0"   # bundled model — decodes with no Play Services and no network          # 1.4.0+ ships 16 KB page-size-aligned native libs
mlkitTextRecognition = "16.0.1"  # bundled model — reads the scale display offline
playLocation = "21.3.0"
securityCrypto = "1.1.0-alpha06"
datastore = "1.1.1"
googleServices = "4.4.2"
firebaseBom = "33.5.1"
# Chat module. Room is the client's single source of truth, WorkManager carries
# the resumable uploads, Paging3's maxSize is the OOM guard on long threads.
#
# media3 was deliberately left out while video only ever opened in an external
# viewer. It is in now because chat records and sends video, and both halves of
# that need it: Transformer to get a 4K clip off the phone down to something a
# depot's uplink can move, and ExoPlayer to play the result back through our own
# authenticated OkHttp stack — the framework MediaPlayer has its own HTTP client
# with no access to the session cookie, which is the exact bug that stopped
# voice notes playing.
room = "2.6.1"
media3 = "1.4.1"
ksp = "2.0.20-1.0.25"          # must track the Kotlin version exactly
work = "2.9.1"
paging = "3.3.2"
exifinterface = "1.3.7"

[libraries]
junit = { module = "junit:junit", version = "4.13.2" }
json-jvm = { module = "org.json:json", version = "20240303" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
