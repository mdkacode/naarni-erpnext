name: Deploy to Azure VM

on:
  push:
    branches: [develop, main]
    paths:
      - 'vehicle_maintenance/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/id_ed25519 frappe@${{ secrets.VM_HOST }} \
            SITE="${{ secrets.SITE_NAME }}" BRANCH="$BRANCH" bash <<'EOF'
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            cd ~/frappe-bench

            # Safety net: whatever happens below (e.g. a frontend build error),
            # always bring the site out of maintenance mode and restart services
            # so a failed deploy can never leave the site down.
            cleanup() {
              bench --site "$SITE" set-maintenance-mode off || true
              sudo supervisorctl restart all || true
            }
            trap cleanup EXIT

            bench --site "$SITE" set-maintenance-mode on

            # Re-sync vehicle_maintenance from the fork's subdirectory
            TMP=$(mktemp -d)
            git clone --depth 1 --branch "$BRANCH" \
              https://github.com/mdkacode/naarni-erpnext.git "$TMP/repo"
            rsync -a --delete \
              --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='node_modules' \
              "$TMP/repo/vehicle_maintenance/" \
              apps/vehicle_maintenance/
            rm -rf "$TMP"

            bench --site "$SITE" migrate

            # Build the Vite/Vue SPA (bench build doesn't touch the frontend dir).
            # Use `npm ci` against the committed package-lock.json for a
            # reproducible install — `yarn install` had no yarn.lock and resolved
            # latest (breaking) transitive versions on each run, which broke the
            # build (PostCSS plugin error) and stranded the site.
            if [ -f apps/vehicle_maintenance/frontend/package.json ]; then
              pushd apps/vehicle_maintenance/frontend >/dev/null
              npm ci
              npm run build
              popd >/dev/null
            fi

            bench build --app vehicle_maintenance
            bench --site "$SITE" clear-cache
            # maintenance-mode off + restart are handled by the EXIT trap above.
          EOF
