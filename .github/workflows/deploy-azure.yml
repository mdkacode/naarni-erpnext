name: Deploy to Azure VM

on:
  push:
    branches: [develop, main]
    paths:
      - 'vehicle_maintenance/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 frappe@${{ secrets.VM_HOST }} <<'EOF'
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            cd ~/frappe-bench
            bench --site ${{ secrets.SITE_NAME }} set-maintenance-mode on
            cd apps/vehicle_maintenance && git pull origin ${GITHUB_REF_NAME:-develop} && cd ../..
            bench --site ${{ secrets.SITE_NAME }} migrate
            bench build --app vehicle_maintenance
            bench --site ${{ secrets.SITE_NAME }} clear-cache
            bench --site ${{ secrets.SITE_NAME }} set-maintenance-mode off
            sudo supervisorctl restart all
          EOF

# Required GitHub repo secrets:
#   VM_HOST      — 20.219.136.19
#   VM_SSH_KEY   — contents of ~/.ssh/id_ed25519 (private key, full file including BEGIN/END lines)
#   SITE_NAME    — service.naarni.com
